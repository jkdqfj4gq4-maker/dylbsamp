name: Build resa_ao_probe dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build tweak
        run: |
          make clean
          make

      - name: Extract Dylib from hidden folder
        run: |
          mkdir -p output
          find .theos -name "*.dylib" -exec cp {} output/ \;

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: resa_ao_probe-dylib
          path: output/
